name: C# 14 compatibility

on:
  push:
    branches: ["csharp14/kncwx2server"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build KncWX2ServerCS/KncWX2ServerCS.sln --configuration Release --nologo
      - name: Record generated EventID snapshot
        run: |
          if ! git diff --quiet -- KncWX2ServerCS/Protocol/Generated/EventId.generated.cs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add KncWX2ServerCS/Protocol/Generated/EventId.generated.cs
            git commit -m "chore: sync generated EventID snapshot"
            git push
          fi
      - name: Run protocol compatibility vectors
        run: dotnet run --project KncWX2ServerCS/Protocol.Tests/KncWX2Server.Protocol.Tests.csproj --configuration Release --no-build
